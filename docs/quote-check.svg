<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="t d">
  <title id="t">The quote checker in action</title>
  <desc id="d">Three quotes. A real one is verified. One with a changed number is rejected by the number rule. A fabricated one is rejected for low match.</desc>
  <style>
    :root { --box:#f6f8fa; --stroke:#d0d7de; --text:#1f2328; --muted:#59636e;
            --ok:#1a7f37; --bad:#cf222e; --okbg:#dafbe1; --badbg:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --box:#161b22; --stroke:#30363d; --text:#e6edf3; --muted:#9198a1;
              --ok:#3fb950; --bad:#f85149; --okbg:#12261a; --badbg:#2d1214; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .muted { font-size: 12.5px; fill: var(--muted); }
    .title { font-size: 17px; font-weight: 600; }
    .box   { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .badge-ok  { fill: var(--okbg);  stroke: var(--ok); }
    .badge-bad { fill: var(--badbg); stroke: var(--bad); }
    .t-ok  { fill: var(--ok);  font-size: 13px; font-weight: 700; }
    .t-bad { fill: var(--bad); font-size: 13px; font-weight: 700; }
    .r { animation: in .55s ease-out both; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: 1.1s; } .r3 { animation-delay: 2s; }
    .b { animation: in .4s ease-out both; }
    .b1 { animation-delay: .6s; } .b2 { animation-delay: 1.5s; } .b3 { animation-delay: 2.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .r, .b { animation: none; } }
  </style>

  <text class="title" x="10" y="26">Code, not an LLM, decides whether a quote is real</text>
  <text class="muted" x="10" y="46">Each quote must be in the filing: at least 5 words, a match of 90 or more out of 100, and every number must match too.</text>

  <!-- 1 real -->
  <g class="r r1">
    <rect class="box" x="10" y="64" width="860" height="52" rx="8"/>
    <text class="mono" x="24" y="86">"...primarily due to product mix and tariff refunds, partially offset by higher costs..."</text>
    <text class="muted" x="24" y="105">A real quote from Apple's 10-K, copied by the bear agent</text>
  </g>
  <g class="b b1">
    <rect class="badge-ok" x="660" y="91" width="200" height="22" rx="11" stroke-width="1.5"/>
    <text class="t-ok" x="760" y="106" text-anchor="middle">VERIFIED  100</text>
  </g>

  <!-- 2 changed number -->
  <g class="r r2">
    <rect class="box" x="10" y="130" width="860" height="52" rx="8"/>
    <text class="mono" x="24" y="152">"Revenue declined <tspan style="font-weight:700;fill:var(--bad)">15%</tspan> in the quarter due to weaker demand"</text>
    <text class="muted" x="24" y="171">The filing says 5%. Text is 90+ similar, so a fuzzy match alone would pass it</text>
  </g>
  <g class="b b2">
    <rect class="badge-bad" x="660" y="157" width="200" height="22" rx="11" stroke-width="1.5"/>
    <text class="t-bad" x="760" y="172" text-anchor="middle">REJECTED  number rule</text>
  </g>

  <!-- 3 fabricated -->
  <g class="r r3">
    <rect class="box" x="10" y="196" width="860" height="52" rx="8"/>
    <text class="mono" x="24" y="218">"Management expects record profits and sees no material risks ahead"</text>
    <text class="muted" x="24" y="237">Not in the filing at all</text>
  </g>
  <g class="b b3">
    <rect class="badge-bad" x="660" y="223" width="200" height="22" rx="11" stroke-width="1.5"/>
    <text class="t-bad" x="760" y="238" text-anchor="middle">NOT VERIFIED  below 90</text>
  </g>

  <text class="muted" x="10" y="264">Rows 2 and 3 are the unit tests' examples; row 1 is from debates/AAPL.json.</text>
</svg>
